apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: desibites-ingress
  namespace: desibites

spec:
  ingressClassName: nginx

  rules:
  - host: desibites.local

    http:

      paths:

      - path: /

        pathType: Prefix

        backend:
          service:
            name: frontend
            port:
              number: 80

      - path: /api

        pathType: Prefix

        backend:
          service:
            name: backend
            port:
              number: 3000
