<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Checkout | DesiBites</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="css/style.css">

</head>

<body>

<div class="container checkout-container">

<h1 class="text-center mb-5">

Checkout

</h1>

<form id="checkoutForm">

<label>Full Name</label>

<input
type="text"
class="form-control"
placeholder="Enter your name"
required>

<br>

<label>Phone Number</label>

<input
type="tel"
class="form-control"
placeholder="Enter phone number"
required>

<br>

<label>Delivery Address</label>

<textarea
class="form-control"
rows="3"
placeholder="Enter address"
required></textarea>

<br>

<label>City</label>

<input
type="text"
class="form-control"
placeholder="Enter city"
required>

<br>

<label>Pincode</label>

<input
type="text"
class="form-control"
placeholder="Enter pincode"
required>

<br>

<h4>Payment Method</h4>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="payment"
checked>

<label class="form-check-label">

Cash on Delivery

</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="payment">

<label class="form-check-label">

Google Pay

</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="payment">

<label class="form-check-label">

PhonePe

</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="payment">

<label class="form-check-label">

Paytm

</label>

</div>

<div class="form-check">

<input
class="form-check-input"
type="radio"
name="payment">

<label class="form-check-label">

UPI

</label>

</div>

<br>

<button
type="submit"
class="btn btn-purple btn-lg w-100">

Place Order

</button>

</form>

</div>

<script src="js/checkout.js"></script>

</body>

</html>
